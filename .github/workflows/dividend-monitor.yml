name: Dividend Monitor - PEA

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update system certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl openssl
          sudo update-ca-certificates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sectigo CA certificates
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/sectigo"

          cd "$RUNNER_TEMP/sectigo"

          curl -fL --retry 3 \
            http://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt \
            -o intermediate.crt

          curl -fL --retry 3 \
            http://crt.sectigo.com/SectigoPublicServerAuthenticationRootR46.crt \
            -o root.crt

          for name in intermediate root; do
            if openssl x509 -in "$name.crt" -noout 2>/dev/null; then
              cp "$name.crt" "$name.pem"
            else
              openssl x509 -inform DER \
                -in "$name.crt" -out "$name.pem"
            fi
          done

          openssl x509 -in intermediate.pem -noout -subject
          openssl x509 -in root.pem -noout -subject

          grep -q "Sectigo Public Server Authentication CA DV R36" \
            <(openssl x509 -in intermediate.pem -noout -subject)

          grep -q "Sectigo Public Server Authentication Root R46" \
            <(openssl x509 -in root.pem -noout -subject)

          cat /etc/ssl/certs/ca-certificates.crt \
            intermediate.pem root.pem > sectigo-ca-bundle.pem

          echo "SSL_CERT_FILE=$PWD/sectigo-ca-bundle.pem" >> "$GITHUB_ENV"

      - name: Verify SSL connection
        run: |
          openssl s_client \
            -connect www.casablanca-bourse.com:443 \
            -servername www.casablanca-bourse.com \
            -CAfile "$SSL_CERT_FILE" \
            -verify_return_error </dev/null

      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          url = "https://www.casablanca-bourse.com/fr/emetteurs/calendrier-financier"

          context = ssl.create_default_context(
              cafile=os.environ["SSL_CERT_FILE"]
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA/3.0"
              }
          )

          print(
              "Morocco time:",
              datetime.now(
                  ZoneInfo("Africa/Casablanca")
              ).isoformat()
          )

          print("Checking official dividend calendar...")

          with urllib.request.urlopen(
              request, timeout=30, context=context
          ) as response:

              html = response.read().decode(
                  "utf-8", errors="replace"
              )

              print("HTTP status:", response.status)
              print("Final URL:", response.url)

          if not html.strip():
              raise RuntimeError("Empty official calendar page")

          print("Page received successfully")

          print(
              "Dividend keyword:",
              "dividende" in html.lower()
              or "dividend" in html.lower()
          )

          print("SSL: VERIFIED")
          print("Connection: SUCCESS")
          PY
