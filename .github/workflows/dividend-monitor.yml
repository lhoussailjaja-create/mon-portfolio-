name: Dividend Monitor - PEA

on:
  schedule:
    # 09:00 Morocco time (UTC+1)
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update system certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl openssl

      - name: Install official Sectigo certificates
        run: |
          set -e

          mkdir -p sectigo

          curl -fLsS --retry 3 \
            https://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt \
            -o sectigo/intermediate.crt

          curl -fLsS --retry 3 \
            https://crt.sectigo.com/SectigoPublicServerAuthenticationRootR46.crt \
            -o sectigo/root.crt

          for cert in intermediate root; do
            if openssl x509 -in "sectigo/${cert}.crt" -noout 2>/dev/null; then
              cp "sectigo/${cert}.crt" "sectigo/${cert}-trusted.crt"
            else
              openssl x509 \
                -inform DER \
                -in "sectigo/${cert}.crt" \
                -out "sectigo/${cert}-trusted.crt"
            fi
          done

          sudo cp sectigo/intermediate-trusted.crt \
            /usr/local/share/ca-certificates/sectigo-intermediate.crt

          sudo cp sectigo/root-trusted.crt \
            /usr/local/share/ca-certificates/sectigo-root.crt

          sudo update-ca-certificates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import ssl
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          url = (
              "https://www.casablanca-bourse.com/"
              "fr/emetteurs/calendrier-financier"
          )

          context = ssl.create_default_context()

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA/2.0"
              }
          )

          print("================================")
          print("DIVIDEND MONITOR - PEA")
          print("================================")

          print(
              "UTC:",
              datetime.now(timezone.utc).isoformat()
          )

          print(
              "Morocco:",
              datetime.now(
                  ZoneInfo("Africa/Casablanca")
              ).isoformat()
          )

          print("Checking official dividend calendar...")

          with urllib.request.urlopen(
              request,
              timeout=40,
              context=context
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("HTTP status:", response.status)
              print("Final URL:", response.url)

              if response.status != 200:
                  raise RuntimeError(
                      "Official calendar returned an error"
                  )

              keywords = [
                  "dividend",
                  "dividende",
                  "dividendes"
              ]

              found = [
                  word for word in keywords
                  if word in html.lower()
              ]

              print("Dividend keywords found:", found)
              print("Page size:", len(html), "characters")
              print("SSL verification: SUCCESS")
              print("Connection: SUCCESS")

          print("================================")
          print("MONITOR CHECK COMPLETED")
          print("================================")
          PY
