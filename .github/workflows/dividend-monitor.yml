name: Dividend Monitor - PEA

"on":
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update trusted certificates
        run: python -m pip install --upgrade certifi

      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          import certifi
          from datetime import datetime, timezone

          url = "https://www.casablanca-bourse.com/fr/emetteurs/calendrier-financier"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "MonPortfolio-PEA-DividendMonitor/1.0"
              }
          )

          print("Date UTC:", datetime.now(timezone.utc).isoformat())
          print("Checking official dividend calendar...")

          ssl_context = ssl.create_default_context(
              cafile=certifi.where()
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
              context=ssl_context
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="replace"
              ).lower()

              print("HTTP status:", response.status)
              print("Page title available:", "<title" in html)
              print(
                  "Dividend keyword:",
                  "dividend" in html or "dividende" in html
              )
              print("Source connection: SUCCESS")

          print("Dividend Monitor check completed.")
          PY
