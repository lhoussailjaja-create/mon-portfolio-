name: Dividend Monitor - Bourse de Casablanca V7

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dividend-monitor-bvc
  cancel-in-progress: false

jobs:
  dividend-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update secure certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates

      - name: Dividend Monitor V7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import pathlib
          import json
          import ssl
          import hashlib
          import urllib.request
          import urllib.parse
          from datetime import datetime
          from zoneinfo import ZoneInfo

          OFFICIAL_URL = (
              "https://www.casablanca-bourse.com/"
              "en/emetteurs/calendrier-financier"
          )

          READER_URL = "https://r.jina.ai/" + OFFICIAL_URL

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]

          API = "https://api.github.com/repos/" + REPOSITORY
          SSL_CONTEXT = ssl.create_default_context()
          MOROCCO = ZoneInfo("Africa/Casablanca")

          def request(url, method="GET", data=None):
              headers = {
                  "User-Agent": "MonPortfolioDividendMonitor/7.0",
                  "Accept": (
                      "application/vnd.github+json"
                      if "api.github.com" in url
                      else "text/plain"
                  ),
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              if "api.github.com" in url:
                  headers["Authorization"] = "Bearer " + TOKEN

              if data is not None:
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=(
                      json.dumps(data).encode("utf-8")
                      if data is not None else None
                  ),
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  req, timeout=60, context=SSL_CONTEXT
              ) as response:
                  content = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  return response.status, content

          def normalize(value):
              value = value.replace("**", "").replace("`", "")
              return re.sub(r"\s+", " ", value).strip()

          def get_calendar():
              print("Connecting to official English financial calendar...")
              print("Source:", OFFICIAL_URL)

              status, content = request(READER_URL)

              if status != 200:
                  raise RuntimeError(
                      "Calendar request failed: " + str(status)
                  )

              if len(content) < 1000:
                  raise RuntimeError("Calendar content is too short")

              if (
                  "Financial Calendar" not in content
                  or "Ex-date" not in content
                  or "Payment date" not in content
              ):
                  print("Unexpected page received.")
                  print(content[:3000])
                  raise RuntimeError(
                      "The official dividend calendar was not found."
                  )

              print("Official financial calendar confirmed.")
              print("Content length:", len(content))

              return content

          def parse_calendar(content):
              alerts = []

              for line in content.splitlines():
                  line = line.strip()

                  if "|" not in line:
                      continue

                  cells = [
                      normalize(cell)
                      for cell in line.strip("|").split("|")
                  ]

                  if len(cells) < 5:
                      continue

                  company = cells[0]
                  ex_date = cells[1]
                  payment_date = cells[2]
                  dividend_type = cells[3]
                  amount = cells[4]

                  if company.lower() in (
                      "", "issuer", "year", "filter by agenda"
                  ):
                      continue

                  if not re.fullmatch(
                      r"\d{2}/\d{2}/\d{4}", ex_date
                  ):
                      continue

                  if not re.fullmatch(
                      r"\d{2}/\d{2}/\d{4}", payment_date
                  ):
                      continue

                  if not re.search(r"\d", amount):
                      continue

                  alerts.append({
                      "company": company,
                      "ex_date": ex_date,
                      "payment_date": payment_date,
                      "dividend_type": dividend_type,
                      "amount": amount
                  })

              unique = {}

              for alert in alerts:
                  key = "|".join([
                      alert["company"].upper(),
                      alert["ex_date"],
                      alert["payment_date"],
                      alert["dividend_type"].upper(),
                      alert["amount"]
                  ])
                  unique[key] = alert

              return list(unique.values())

          def is_relevant(alert):
              today = datetime.now(MOROCCO).date()

              ex_date = datetime.strptime(
                  alert["ex_date"], "%d/%m/%Y"
              ).date()

              payment_date = datetime.strptime(
                  alert["payment_date"], "%d/%m/%Y"
              ).date()

              return ex_date >= today or payment_date >= today

          def create_issue(alert):
              identity = "|".join([
                  alert["company"],
                  alert["ex_date"],
                  alert["payment_date"],
                  alert["dividend_type"],
                  alert["amount"]
              ])

              fingerprint = hashlib.sha256(
                  identity.upper().encode("utf-8")
              ).hexdigest()[:20]

              title = (
                  "[DIVIDEND] "
                  + alert["company"]
                  + " - "
                  + alert["ex_date"]
                  + " - "
                  + fingerprint
              )

              query = urllib.parse.urlencode({
                  "q": (
                      "repo:" + REPOSITORY
                      + " is:issue "
                      + fingerprint
                  )
              })

              _, result = request(
                  "https://api.github.com/search/issues?" + query
              )

              existing = json.loads(result)

              if existing.get("total_count", 0) > 0:
                  print("DUPLICATE SKIPPED:", title)
                  return False

              detected = datetime.now(MOROCCO).isoformat()

              body = "\n".join([
                  "## Nouveau dividende - Bourse de Casablanca",
                  "",
                  "**Société :** " + alert["company"],
                  "",
                  "**Date de détachement :** " + alert["ex_date"],
                  "",
                  "**Date de paiement :** " + alert["payment_date"],
                  "",
                  "**Type :** " + alert["dividend_type"],
                  "",
                  "**Montant brut par action :** " + alert["amount"],
                  "",
                  "**Date de détection :** " + detected,
                  "",
                  "**Source officielle :** " + OFFICIAL_URL,
                  "",
                  "---",
                  "Détection automatique - Mon Portfolio Dividend Monitor V7.",
                  "Cette surveillance concerne toutes les sociétés du calendrier,",
                  "et pas uniquement les titres détenus dans le PEA."
              ])

              _, result = request(
                  API + "/issues",
                  method="POST",
                  data={
                      "title": title,
                      "body": body
                  }
              )

              created = json.loads(result)

              if "html_url" not in created:
                  raise RuntimeError(
                      "Issue creation failed: "
                      + json.dumps(created, ensure_ascii=False)
                  )

              print("NEW ALERT:", created["html_url"])
              return True

          def main():
              print("====================================")
              print("DIVIDEND MONITOR - V7")
              print("====================================")

              print(
                  "Morocco time:",
                  datetime.now(MOROCCO).isoformat()
              )

              print("SSL verification: ENABLED")

              content = get_calendar()

              all_alerts = parse_calendar(content)

              print("Dividend rows found:", len(all_alerts))

              if not all_alerts:
                  print("Calendar preview:")
                  print(content[:5000])
                  raise RuntimeError(
                      "No dividend rows found. "
                      "Check official calendar format."
                  )

              relevant = [
                  alert for alert in all_alerts
                  if is_relevant(alert)
              ]

              print("Relevant current/future dividends:", len(relevant))

              snapshot = {
                  "updatedAt": datetime.now(MOROCCO).isoformat(),
                  "source": OFFICIAL_URL,
                  "announcements": [
                      {
                          "company": alert["company"],
                          "exDate": alert["ex_date"],
                          "paymentDate": alert["payment_date"],
                          "type": alert["dividend_type"],
                          "amount": alert["amount"],
                          "source": OFFICIAL_URL,
                          "sourceName": "Bourse de Casablanca",
                          "url": ""
                      }
                      for alert in relevant
                  ]
              }
              snapshot_path = pathlib.Path("data/dividend-announcements.json")
              snapshot_path.parent.mkdir(parents=True, exist_ok=True)
              snapshot_path.write_text(
                  json.dumps(snapshot, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("Published snapshot rows:", len(relevant))

              created = 0

              for alert in relevant:
                  print(
                      "Checking:",
                      alert["company"],
                      "| Ex-date:",
                      alert["ex_date"],
                      "| Payment:",
                      alert["payment_date"],
                      "| Amount:",
                      alert["amount"]
                  )

                  if create_issue(alert):
                      created += 1

              print("New alerts:", created)
              print("====================================")
              print("MONITOR COMPLETED SUCCESSFULLY")
              print("====================================")

          if __name__ == "__main__":
              main()
          PY

      - name: Publish calendar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend-announcements.json
          if git diff --cached --quiet; then
            echo "Calendar snapshot is unchanged."
          else
            git commit -m "Update dividend calendar snapshot"
            git push origin HEAD:main
          fi
