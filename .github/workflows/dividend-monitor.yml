name: Dividend Monitor - Bourse de Casablanca V7

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dividend-monitor-bvc
  cancel-in-progress: false

jobs:
  dividend-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update secure certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates

      - name: Dividend Monitor V7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import pathlib
          import json
          import ssl
          import hashlib
          import urllib.request
          import urllib.parse
          from datetime import datetime
          from zoneinfo import ZoneInfo

          OFFICIAL_URL = (
              "https://www.casablanca-bourse.com/"
              "en/emetteurs/calendrier-financier"
          )

          READER_URL = "https://r.jina.ai/" + OFFICIAL_URL

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]

          API = "https://api.github.com/repos/" + REPOSITORY
          SSL_CONTEXT = ssl.create_default_context()
          MOROCCO = ZoneInfo("Africa/Casablanca")

          def request(url, method="GET", data=None):
              headers = {
                  "User-Agent": "MonPortfolioDividendMonitor/7.0",
                  "Accept": (
                      "application/vnd.github+json"
                      if "api.github.com" in url
                      else "text/plain"
                  ),
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              if "api.github.com" in url:
                  headers["Authorization"] = "Bearer " + TOKEN

              if data is not None:
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=(
                      json.dumps(data).encode("utf-8")
                      if data is not None else None
                  ),
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  req, timeout=60, context=SSL_CONTEXT
              ) as response:
                  content = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  return response.status, content

          def normalize(value):
              value = value.replace("**", "").replace("`", "")
              return re.sub(r"\s+", " ", value).strip()

          def get_calendar():
              print("Connecting to official English financial calendar...")
              print("Source:", OFFICIAL_URL)

              status, content = request(READER_URL)

              if status != 200:
                  raise RuntimeError(
                      "Calendar request failed: " + str(status)
                  )

              if len(content) < 1000:
                  raise RuntimeError("Calendar content is too short")

              # Do not bind validation to the page title or exact English labels.
              # The parser below validates that a recognizable calendar schema exists.
              print("Calendar response received; validating its table schema.")
              print("Content length:", len(content))

              return content

          def parse_calendar(content):
              alerts = []
              column_aliases = {
                  "company": ("issuer", "company", "emetteur", "émetteur", "name"),
                  "ex_date": ("ex-date", "ex date", "detachment", "détachement"),
                  "payment_date": ("payment date", "payment", "paiement"),
                  "dividend_type": ("type", "dividend type", "type de dividende"),
                  "amount": ("amount", "montant", "dividend", "amount per share", "dividend per share", "dividend amount")
              }

              def header_key(value):
                  return re.sub(r"[^a-z0-9]+", " ", value.lower()).strip()

              def parse_date(value):
                  for fmt in ("%d/%m/%Y", "%Y-%m-%d", "%d-%m-%Y", "%d.%m.%Y"):
                      try:
                          return datetime.strptime(value.strip(), fmt).strftime("%d/%m/%Y")
                      except ValueError:
                          pass
                  return ""

              indexes = None
              for line in content.splitlines():
                  if "|" not in line:
                      continue
                  cells = [normalize(x) for x in line.strip().strip("|").split("|")]
                  keys = [header_key(x) for x in cells]
                  found = {}
                  for field, aliases in column_aliases.items():
                      for i, key in enumerate(keys):
                          if any(key == header_key(alias) or key.startswith(header_key(alias) + " ") for alias in aliases):
                              found[field] = i
                              break
                  if all(field in found for field in column_aliases):
                      indexes = found
                      continue
                  if not indexes or len(cells) <= max(indexes.values()):
                      continue
                  row = {field: cells[i] for field, i in indexes.items()}
                  ex_date, payment_date = parse_date(row["ex_date"]), parse_date(row["payment_date"])
                  if not row["company"] or not ex_date or not payment_date or not re.search(r"\d", row["amount"]):
                      continue
                  alerts.append({
                      "company": row["company"], "ex_date": ex_date,
                      "payment_date": payment_date,
                      "dividend_type": row["dividend_type"] or "Unspecified",
                      "amount": row["amount"]
                  })
              if indexes is None:
                  print("Calendar preview:")
                  print(content[:3000])
                  raise RuntimeError("No recognizable dividend table schema found; preserving prior JSON.")

              unique = {}
              for alert in alerts:
                  unique[event_id(alert)] = alert
              return list(unique.values())

          def event_id(alert):
              import unicodedata
              def clean(value):
                  value = unicodedata.normalize("NFKD", str(value)).encode("ascii", "ignore").decode().casefold()
                  return re.sub(r"[^a-z0-9]+", " ", value).strip()
              identity = "|".join(clean(alert.get(k, "")) for k in
                  ("company", "ex_date", "payment_date", "dividend_type", "amount"))
              return hashlib.sha256(identity.encode("utf-8")).hexdigest()

          def is_relevant(alert):
              today = datetime.now(MOROCCO).date()

              ex_date = datetime.strptime(
                  alert["ex_date"], "%d/%m/%Y"
              ).date()

              payment_date = datetime.strptime(
                  alert["payment_date"], "%d/%m/%Y"
              ).date()

              return ex_date >= today or payment_date >= today

          def create_issue(alert):
              identity = "|".join([
                  alert["company"],
                  alert["ex_date"],
                  alert["payment_date"],
                  alert["dividend_type"],
                  alert["amount"]
              ])

              fingerprint = hashlib.sha256(
                  identity.upper().encode("utf-8")
              ).hexdigest()[:20]

              title = (
                  "[DIVIDEND] "
                  + alert["company"]
                  + " - "
                  + alert["ex_date"]
                  + " - "
                  + fingerprint
              )

              query = urllib.parse.urlencode({
                  "q": (
                      "repo:" + REPOSITORY
                      + " is:issue "
                      + fingerprint
                  )
              })

              _, result = request(
                  "https://api.github.com/search/issues?" + query
              )

              existing = json.loads(result)

              if existing.get("total_count", 0) > 0:
                  print("DUPLICATE SKIPPED:", title)
                  return False

              detected = datetime.now(MOROCCO).isoformat()

              body = "\n".join([
                  "## Nouveau dividende - Bourse de Casablanca",
                  "",
                  "**Société :** " + alert["company"],
                  "",
                  "**Date de détachement :** " + alert["ex_date"],
                  "",
                  "**Date de paiement :** " + alert["payment_date"],
                  "",
                  "**Type :** " + alert["dividend_type"],
                  "",
                  "**Montant brut par action :** " + alert["amount"],
                  "",
                  "**Date de détection :** " + detected,
                  "",
                  "**Source officielle :** " + OFFICIAL_URL,
                  "",
                  "---",
                  "Détection automatique - Mon Portfolio Dividend Monitor V7.",
                  "Cette surveillance concerne toutes les sociétés du calendrier,",
                  "et pas uniquement les titres détenus dans le PEA."
              ])

              _, result = request(
                  API + "/issues",
                  method="POST",
                  data={
                      "title": title,
                      "body": body
                  }
              )

              created = json.loads(result)

              if "html_url" not in created:
                  raise RuntimeError(
                      "Issue creation failed: "
                      + json.dumps(created, ensure_ascii=False)
                  )

              print("NEW ALERT:", created["html_url"])
              return True

          def main():
              print("====================================")
              print("DIVIDEND MONITOR - V8")
              print("Morocco time:", datetime.now(MOROCCO).isoformat())
              content = get_calendar()
              all_alerts = parse_calendar(content)
              print("Dividend rows found:", len(all_alerts))
              # A valid calendar with zero rows is not a failure and never clears the ledger.
              relevant = [a for a in all_alerts if is_relevant(a)]
              print("Relevant current/future dividends:", len(relevant))

              snapshot_path = pathlib.Path("data/dividend-announcements.json")
              snapshot_path.parent.mkdir(parents=True, exist_ok=True)
              previous = {"announcements": []}
              if snapshot_path.exists():
                  try:
                      previous = json.loads(snapshot_path.read_text(encoding="utf-8"))
                      if not isinstance(previous, dict) or not isinstance(previous.get("announcements"), list):
                          raise ValueError("invalid announcements structure")
                  except Exception as exc:
                      raise RuntimeError("Existing dividend JSON is invalid; refusing to overwrite: " + str(exc))
              announcements = list(previous.get("announcements", []))
              known = {x.get("eventId") for x in announcements if isinstance(x, dict) and x.get("eventId")}
              by_legacy = set()
              for item in announcements:
                  if isinstance(item, dict):
                      by_legacy.add("|".join([item.get("company",""),item.get("exDate",""),item.get("paymentDate",""),item.get("type",""),item.get("amount","")]).upper())

              created = 0
              for alert in relevant:
                  eid = event_id(alert)
                  if eid in known:
                      print("ALREADY IN JSON:", alert["company"], eid)
                      continue
                  legacy = "|".join([alert["company"],alert["ex_date"],alert["payment_date"],alert["dividend_type"],alert["amount"]]).upper()
                  # Existing snapshot items and existing GitHub issues are both dedupe sources.
                  url = ""
                  if legacy in by_legacy:
                      print("LEGACY DUPLICATE SKIPPED:", alert["company"])
                      continue
                  issue_url = create_issue(alert)
                  if issue_url:
                      url = issue_url
                      created += 1
                  announcements.append({
                      "eventId": eid, "company": alert["company"],
                      "exDate": alert["ex_date"], "paymentDate": alert["payment_date"],
                      "type": alert["dividend_type"], "amount": alert["amount"],
                      "source": OFFICIAL_URL, "sourceName": "Bourse de Casablanca",
                      "url": url
                  })
                  known.add(eid)
                  by_legacy.add(legacy)

              snapshot = {
                  "updatedAt": datetime.now(MOROCCO).isoformat(),
                  "source": OFFICIAL_URL,
                  "announcements": announcements
              }
              snapshot_path.write_text(json.dumps(snapshot, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Published snapshot rows (history retained):", len(announcements))
              print("New alerts:", created)
              print("MONITOR COMPLETED SUCCESSFULLY")

          if __name__ == "__main__":
              main()
          PY

      - name: Publish calendar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend-announcements.json
          if git diff --cached --quiet; then
            echo "Calendar snapshot is unchanged."
          else
            git commit -m "Update dividend calendar snapshot"
            git push origin HEAD:main
          fi
