name: Dividend Monitor - PEA V2

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dividend-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monitor official Bourse calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import re
          import os
          import json
          import hashlib
          import urllib.request
          import unicodedata
          from html.parser import HTMLParser
          from datetime import datetime, timezone

          URL = (
              "https://www.casablanca-bourse.com/"
              "fr/emetteurs/calendrier-financier"
          )

          COMPANIES = {
              "AKDITAL": ["AKDITAL"],
              "MARSA MAROC": ["MARSA MAROC"],
              "MAROC TELECOM": [
                  "MAROC TELECOM",
                  "ITISSALAT AL-MAGHRIB"
              ],
              "TOTALENERGIES MAROC": [
                  "TOTALENERGIES MAROC",
                  "TOTALENERGIES MARKETING MAROC"
              ]
          }

          KEYWORDS = [
              "dividende",
              "dividendes",
              "distribution",
              "mise en paiement",
              "paiement du coupon",
              "coupon",
              "acompte sur dividende"
          ]

          class TextParser(HTMLParser):
              def _init_(self):
                  super()._init_()
                  self.parts = []

              def handle_data(self, data):
                  if data.strip():
                      self.parts.append(data.strip())

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              return re.sub(r"\s+", " ", value).upper()

          print("DIVIDEND MONITOR - PEA V2")
          print("UTC:", datetime.now(timezone.utc).isoformat())
          print("Checking:", URL)

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolioDividendMonitor/2.0"
              }
          )

          with urllib.request.urlopen(request, timeout=45) as response:
              if response.status != 200:
                  raise RuntimeError(
                      f"Official calendar HTTP {response.status}"
                  )
              html = response.read().decode(
                  "utf-8", errors="replace"
              )

          parser = TextParser()
          parser.feed(html)
          page = normalize(" ".join(parser.parts))

          if len(page) < 200:
              raise RuntimeError("Official calendar returned insufficient text")

          print("Page successfully downloaded.")
          print("Extracted characters:", len(page))

          alerts = []

          for company, aliases in COMPANIES.items():
              for alias in aliases:
                  alias = normalize(alias)
                  for match in re.finditer(
                      re.escape(alias), page
                  ):
                      start = max(0, match.start() - 1200)
                      end = min(len(page), match.end() + 1200)
                      context = page[start:end]

                      found = [
                          word for word in KEYWORDS
                          if normalize(word) in context
                      ]

                      if found:
                          alerts.append({
                              "company": company,
                              "alias": alias,
                              "keywords": found,
                              "context": context[:1800]
                          })
                          break

                  if any(a["company"] == company for a in alerts):
                      break

          if not alerts:
              print("No matching dividend information detected.")
              print("MONITOR COMPLETED")
              raise SystemExit(0)

          print("Potential dividend matches:", len(alerts))

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          content = json.dumps(
              alerts, ensure_ascii=False, sort_keys=True
          )
          digest = hashlib.sha256(
              content.encode("utf-8")
          ).hexdigest()[:12]

          title = f"Potential dividend announcement - {digest}"

          api = f"https://api.github.com/repos/{repo}/issues"

          def github_request(url, method="GET", data=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "MonPortfolioDividendMonitor"
              }
              body = (
                  json.dumps(data).encode("utf-8")
                  if data is not None else None
              )
              req = urllib.request.Request(
                  url, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          existing = github_request(
              api + "?state=all&per_page=100"
          )

          if any(item["title"] == title for item in existing):
              print("This alert already exists. No duplicate created.")
              raise SystemExit(0)

          body = [
              "## Potential dividend information detected",
              "",
              f"Official source: {URL}",
              "",
              "Please verify each result against the original official notice.",
              "",
              "This is an automated detection, not confirmation of a dividend.",
              ""
          ]

          for alert in alerts:
              body.extend([
                  f"### {alert['company']}",
                  f"Matched keywords: {', '.join(alert['keywords'])}",
                  "",
                  f"Extracted context: {alert['context']}",
                  "",
                  "---",
                  ""
              ])

          body.extend([
              f"Detection date: {datetime.now(timezone.utc).isoformat()}",
              "",
              "Source checked: Bourse de Casablanca financial calendar."
          ])

          issue = github_request(
              api,
              method="POST",
              data={
                  "title": title,
                  "body": "\n".join(body),
                 
              }
          )

          print("ALERT CREATED:", issue["html_url"])
          print("MONITOR COMPLETED")
          PY
