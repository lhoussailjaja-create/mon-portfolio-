name: Dividend Monitor - PEA

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update system certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates openssl curl
          sudo update-ca-certificates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi
        run: |
          python -m pip install --upgrade pip certifi

      - name: Check SSL certificate
        run: |
          echo "Checking Casablanca Bourse SSL..."
          openssl s_client \
            -connect www.casablanca-bourse.com:443 \
            -servername www.casablanca-bourse.com \
            -verify_return_error </dev/null

      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          import certifi
          from datetime import datetime
          from zoneinfo import ZoneInfo

          url = "https://www.casablanca-bourse.com/fr/emetteurs/calendrier-financier"

          print("Morocco time:",
                datetime.now(ZoneInfo("Africa/Casablanca")).isoformat())
          print("Checking official dividend calendar...")

          contexts = [
              ("SYSTEM", ssl.create_default_context()),
              ("CERTIFI", ssl.create_default_context(
                  cafile=certifi.where()
              ))
          ]

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA/2.0"
              }
          )

          response = None

          for name, context in contexts:
              try:
                  print("Trying SSL:", name)
                  response = urllib.request.urlopen(
                      request,
                      timeout=30,
                      context=context
                  )
                  break
              except Exception as error:
                  print(name, "FAILED:", repr(error))

          if response is None:
              raise RuntimeError(
                  "SSL connection failed with system and certifi certificates. "
                  "The official website certificate chain must be checked."
              )

          with response:
              html = response.read().decode(
                  "utf-8", errors="replace"
              )

              print("HTTP status:", response.status)
              print("Final URL:", response.url)

          if not html.strip():
              raise RuntimeError("Official calendar returned an empty page.")

          print("Page received successfully.")
          print("Dividend keyword:",
                "dividend" in html.lower()
                or "dividende" in html.lower())

          print("Connection: SUCCESS")
          PY
