name: Dividend Monitor - PEA V5

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dividend-monitor-pea
  cancel-in-progress: false

jobs:
  dividend-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update secure certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates

      - name: Dividend Monitor V5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import ssl
          import hashlib
          import unicodedata
          import urllib.request
          import urllib.parse
          import urllib.error

          from html.parser import HTMLParser
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          OFFICIAL_URL = (
              "https://www.casablanca-bourse.com/"
              "fr/emetteurs/calendrier-financier"
          )

          PROXY_URL = (
              "https://r.jina.ai/"
              + OFFICIAL_URL
          )

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]

          API = (
              "https://api.github.com/repos/"
              + REPOSITORY
          )

          SSL_CONTEXT = ssl.create_default_context()

          COMPANIES = {
              "ITISSALAT AL MAGHRIB": [
                  "ITISSALAT AL MAGHRIB",
                  "ITISSALAT AL-MAGHRIB",
                  "MAROC TELECOM",
                  "IAM"
              ],
              "AKDITAL": [
                  "AKDITAL"
              ],
              "MARSA MAROC": [
                  "MARSA MAROC",
                  "MARSA MAROC SA",
                  "SOCIETE D'EXPLOITATION DES PORTS"
              ],
              "TOTALENERGIES MARKETING MAROC": [
                  "TOTALENERGIES MARKETING MAROC",
                  "TOTALENERGIES MAROC",
                  "TOTAL MAROC"
              ]
          }

          DIVIDEND_KEYWORDS = [
              "DIVIDENDE",
              "DIVIDENDES",
              "DIVIDEND",
              "DIVIDENDS",
              "DISTRIBUTION",
              "MISE EN PAIEMENT",
              "DATE DE DETACHEMENT",
              "DETACHEMENT",
              "COUPON",
              "ACOMPTE SUR DIVIDENDE"
          ]

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              return re.sub(
                  r"\s+", " ", value
              ).upper().strip()

          class TextExtractor(HTMLParser):
              def _init_(self):
                  super()._init_()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.parts.append(data.strip())

          def request(url, method="GET", data=None):
              headers = {
                  "User-Agent": "MonPortfolioDividendMonitor/5.0",
                  "Accept": (
                      "application/vnd.github+json"
                      if "api.github.com" in url
                      else "text/plain,text/html,/"
                  ),
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              if "api.github.com" in url:
                  headers["Authorization"] = "Bearer " + TOKEN

              if data is not None:
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=(
                      json.dumps(data).encode("utf-8")
                      if data is not None else None
                  ),
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  req,
                  timeout=45,
                  context=SSL_CONTEXT
              ) as response:
                  return (
                      response.status,
                      response.read().decode(
                          "utf-8", errors="replace"
                      )
                  )

          def get_official_calendar():
              print("Trying official Bourse website...")

              try:
                  status, content = request(OFFICIAL_URL)

                  if status == 200 and len(content) > 100:
                      print("Official direct connection: SUCCESS")
                      return content, "Official direct"

              except Exception as error:
                  print("Direct connection failed:", str(error))

              print("Trying HTTPS reader fallback...")

              try:
                  status, content = request(PROXY_URL)

                  if status == 200 and len(content) > 100:
                      print("HTTPS fallback: SUCCESS")
                      print("Content source:", OFFICIAL_URL)
                      print("Retrieval method: Jina Reader")
                      return content, "HTTPS reader fallback"

                  raise RuntimeError(
                      "Fallback returned invalid response"
                  )

              except Exception as error:
                  raise RuntimeError(
                      "Both official and fallback connections failed: "
                      + str(error)
                  )

          def extract_text(content):
              parser = TextExtractor()
              parser.feed(content)

              return normalize(
                  " ".join(parser.parts)
              )

          def find_alerts(text):
              alerts = []

              for company, aliases in COMPANIES.items():
                  for alias in aliases:
                      alias = normalize(alias)
                      start = 0

                      while True:
                          position = text.find(alias, start)

                          if position < 0:
                              break

                          left = max(0, position - 500)
                          right = min(
                              len(text),
                              position + len(alias) + 700
                          )

                          context = text[left:right]

                          matched = [
                              keyword
                              for keyword in DIVIDEND_KEYWORDS
                              if keyword in context
                          ]

                          for keyword in matched:
                              alerts.append({
                                  "company": company,
                                  "keyword": keyword,
                                  "context": context[:1000]
                              })

                          start = position + len(alias)

              unique = {}

              for alert in alerts:
                  key = (
                      alert["company"],
                      alert["keyword"],
                      normalize(alert["context"])
                  )
                  unique[key] = alert

              return list(unique.values())

          def create_issue(alert):
              fingerprint = hashlib.sha256(
                  (
                      alert["company"]
                      + "|"
                      + alert["keyword"]
                      + "|"
                      + normalize(alert["context"])
                  ).encode("utf-8")
              ).hexdigest()[:16]

              title = (
                  "[DIVIDEND] "
                  + alert["company"]
                  + " - "
                  + alert["keyword"]
                  + " - "
                  + fingerprint
              )

              query = urllib.parse.urlencode({
                  "q": (
                      "repo:" + REPOSITORY
                      + " is:issue "
                      + fingerprint
                  )
              })

              status, result = request(
                  "https://api.github.com/search/issues?"
                  + query
              )

              existing = json.loads(result)

              if existing.get("total_count", 0) > 0:
                  print("DUPLICATE SKIPPED:", title)
                  return False

              morocco_time = datetime.now(
                  ZoneInfo("Africa/Casablanca")
              ).isoformat()

              body = "\n".join([
                  "## Dividend Monitor - PEA V5",
                  "",
                  "Company: " + alert["company"],
                  "",
                  "Detected keyword: " + alert["keyword"],
                  "",
                  "Detection date (Morocco): " + morocco_time,
                  "",
                  "Official source: " + OFFICIAL_URL,
                  "",
                  "### Extracted context",
                  "",
                  alert["context"],
                  "",
                  "---",
                  "Automatically detected by Mon Portfolio Dividend Monitor V5."
              ])

              issue = {
                  "title": title,
                  "body": body
              }

              status, result = request(
                  API + "/issues",
                  method="POST",
                  data=issue
              )

              created = json.loads(result)

              if status not in (200, 201):
                  raise RuntimeError(
                      "GitHub issue creation failed"
                  )

              print(
                  "ALERT CREATED:",
                  created.get("html_url", "Unknown")
              )

              return True

          def main():
              print("================================")
              print("DIVIDEND MONITOR - PEA V5")
              print("================================")

              print(
                  "UTC:",
                  datetime.now(timezone.utc).isoformat()
              )

              print(
                  "Morocco:",
                  datetime.now(
                      ZoneInfo("Africa/Casablanca")
                  ).isoformat()
              )

              print("SSL verification: ENABLED")

              content, source = get_official_calendar()

              print("Retrieval method:", source)
              print("Page size:", len(content))

              page_text = extract_text(content)

              print("Extracting dividend information...")

              alerts = find_alerts(page_text)

              print("Detected alerts:", len(alerts))

              created = 0

              for alert in alerts:
                  print(
                      "Checking:",
                      alert["company"],
                      alert["keyword"]
                  )

                  if create_issue(alert):
                      created += 1

              print("New alerts:", created)
              print("Monitor completed successfully.")

          if _ _name_ _ == "_ _main_ _":
              main()

          PY
