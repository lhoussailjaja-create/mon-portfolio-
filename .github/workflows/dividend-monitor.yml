
name: Dividend Monitor - PEA

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update system certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl openssl

      - name: Install verified Sectigo certificates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p certificates

          echo "Downloading official Sectigo DV R36..."
          curl -fLsS --retry 3 \
            http://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt \
            -o certificates/intermediate.der

          echo "Downloading official Sectigo Root R46..."
          curl -fLsS --retry 3 \
            http://crt.sectigo.com/SectigoPublicServerAuthenticationRootR46.crt \
            -o certificates/root.der

          echo "Checking SHA-256 fingerprints..."

          echo "8c54c334b66ba4e426772af4a3f9136c19a1aec729fdb28c535c07a5a4ef22e0  certificates/intermediate.der" \
            | sha256sum -c -

          echo "7bb647a62aeeac88bf257aa522d01ffea395e0ab45c73f93f65654ec38f25a06  certificates/root.der" \
            | sha256sum -c -

          openssl x509 -inform DER \
            -in certificates/intermediate.der \
            -out certificates/intermediate.crt

          openssl x509 -inform DER \
            -in certificates/root.der \
            -out certificates/root.crt

          openssl x509 -in certificates/intermediate.crt \
            -noout -subject -issuer

          openssl x509 -in certificates/root.crt \
            -noout -subject -issuer

          sudo cp certificates/intermediate.crt \
            /usr/local/share/ca-certificates/sectigo-intermediate.crt

          sudo cp certificates/root.crt \
            /usr/local/share/ca-certificates/sectigo-root.crt

          sudo update-ca-certificates

          echo "Sectigo certificates verified and installed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official Bourse de Casablanca calendar
        shell: bash
        run: |
          python - <<'PY'
          import ssl
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          url = (
              "https://www.casablanca-bourse.com/"
              "fr/emetteurs/calendrier-financier"
          )

          context = ssl.create_default_context()

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA/2.0"
              }
          )

          print("================================")
          print("DIVIDEND MONITOR - PEA")
          print("================================")

          print(
              "UTC:",
              datetime.now(timezone.utc).isoformat()
          )

          print(
              "Morocco:",
              datetime.now(
                  ZoneInfo("Africa/Casablanca")
              ).isoformat()
          )

          print("Checking official calendar...")

          with urllib.request.urlopen(
              request,
              timeout=40,
              context=context
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("HTTP:", response.status)
              print("URL:", response.url)

              if response.status != 200:
                  raise RuntimeError("Calendar unavailable")

              keywords = [
                  "dividend",
                  "dividende",
                  "dividendes"
              ]

              found = [
                  word for word in keywords
                  if word in html.lower()
              ]

              print("Keywords:", found)
              print("Page size:", len(html))
              print("SSL verification: SUCCESS")
              print("Connection: SUCCESS")

          print("MONITOR CHECK COMPLETED")
          PY
