name: Dividend Monitor - PEA

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update system certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates openssl
          sudo update-ca-certificates --fresh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi
        run: |
          python -m pip install --upgrade pip certifi

      - name: Diagnose official website SSL
        run: |
          echo "Checking Casablanca Bourse TLS certificate..."
          openssl s_client \
            -connect www.casablanca-bourse.com:443 \
            -servername www.casablanca-bourse.com \
            -verify_return_error \
            </dev/null 2>&1 || true

      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          import certifi
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          url = "https://www.casablanca-bourse.com/fr/emetteurs/calendrier-financier"

          print("UTC:", datetime.now(timezone.utc).isoformat())
          print("Morocco:", datetime.now(
              ZoneInfo("Africa/Casablanca")
          ).isoformat())

          print("Certifi bundle:", certifi.where())

          context = ssl.create_default_context()
          context.load_verify_locations(cafile=certifi.where())

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA/1.0"
              }
          )

          print("Checking official dividend calendar...")

          try:
              with urllib.request.urlopen(
                  request, timeout=30, context=context
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )

                  print("HTTP status:", response.status)
                  print("Final URL:", response.url)
                  print("Dividend keyword:",
                        "dividend" in html.lower()
                        or "dividende" in html.lower())

                  print("SSL verification: SUCCESS")
                  print("Connection: SUCCESS")

          except ssl.SSLCertVerificationError as error:
              print("SSL verification: FAILED")
              print("Certificate error:", error)
              raise

          except Exception as error:
              print("Connection failed:", repr(error))
              raise
          PY
