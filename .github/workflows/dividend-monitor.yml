name: Dividend Monitor - PEA

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          from datetime import datetime, timezone

          url = "https://www.casablanca-bourse.com/fr/emetteurs/calendrier-financier"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA-DividendMonitor/1.0"
              }
          )

          print("Date UTC:", datetime.now(timezone.utc).isoformat())
          print("Checking official Bourse de Casablanca...")

          ssl_context = ssl.create_default_context()

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30,
                  context=ssl_context
              ) as response:

                  html = response.read().decode("utf-8", errors="replace")

                  print("HTTP status:", response.status)
                  print("Final URL:", response.url)
                  print("Page title available:", "<title" in html.lower())
                  print(
                      "Dividend keyword:",
                      "dividend" in html.lower()
                      or "dividende" in html.lower()
                  )
                  print("HTTPS certificate verification: SUCCESS")
                  print("Source connection: SUCCESS")

          except Exception as error:
              print("Source connection: FAILED")
              print("Error:", repr(error))
              raise
          PY
