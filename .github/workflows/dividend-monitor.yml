name: Dividend Monitor - PEA

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Update system certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi
        run: |
          python -m pip install --upgrade pip certifi

      - name: Diagnose SSL connection
        run: |
          python - <<'PY'
          import ssl
          import certifi
          import socket

          host = "www.casablanca-bourse.com"

          print("Certifi file:", certifi.where())

          for name, cafile in [
              ("Certifi", certifi.where()),
              ("System", "/etc/ssl/certs/ca-certificates.crt")
          ]:
              print("\nTesting:", name)
              try:
                  context = ssl.create_default_context(
                      cafile=cafile
                  )
                  with socket.create_connection(
                      (host, 443), timeout=20
                  ) as sock:
                      with context.wrap_socket(
                          sock, server_hostname=host
                      ) as secure:
                          print("SUCCESS:", secure.version())
              except Exception as error:
                  print("FAILED:", repr(error))

          PY

      - name: Check official Bourse de Casablanca calendar
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          import certifi
          from datetime import datetime, timezone

          url = "https://www.casablanca-bourse.com/fr/emetteurs/calendrier-financier"

          context = ssl.create_default_context(
              cafile=certifi.where()
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 MonPortfolio-PEA/1.0"
              }
          )

          print("UTC:", datetime.now(timezone.utc).isoformat())
          print("Checking official dividend calendar...")

          with urllib.request.urlopen(
              request, timeout=30, context=context
          ) as response:
              html = response.read().decode(
                  "utf-8", errors="replace"
              )

              print("HTTP status:", response.status)
              print("Final URL:", response.url)

              print(
                  "Dividend keyword:",
                  "dividend" in html.lower()
                  or "dividende" in html.lower()
              )

          print("Connection: SUCCESS")
          PY
