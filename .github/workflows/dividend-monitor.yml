name: Dividend Monitor - Toutes les actions BVC

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dividend-monitor-bvc
  cancel-in-progress: false

jobs:
  dividend-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update secure certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates

      - name: Scan all Bourse de Casablanca dividends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import ssl
          import hashlib
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          OFFICIAL_URL = (
              "https://www.casablanca-bourse.com/"
              "fr/emetteurs/calendrier-financier"
          )
          READER_URL = "https://r.jina.ai/" + OFFICIAL_URL

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          API = "https://api.github.com/repos/" + REPOSITORY
          SSL_CONTEXT = ssl.create_default_context()

          def request(url, method="GET", data=None):
              headers = {
                  "User-Agent": "MonPortfolioDividendMonitor/6.0",
                  "Accept": "application/vnd.github+json"
                      if "api.github.com" in url else "text/plain",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
              if "api.github.com" in url:
                  headers["Authorization"] = "Bearer " + TOKEN
              if data is not None:
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode("utf-8")
                      if data is not None else None,
                  headers=headers,
                  method=method
              )
              with urllib.request.urlopen(
                  req, timeout=45, context=SSL_CONTEXT
              ) as response:
                  return response.status, response.read().decode(
                      "utf-8", errors="replace"
                  )

          def normalize(value):
              return re.sub(r"\s+", " ", value).strip()

          def get_calendar():
              print("Reading the official Casablanca Stock Exchange calendar...")
              status, content = request(READER_URL)
              if status != 200 or len(content) < 100:
                  raise RuntimeError("Official calendar reader returned invalid content")
              print("Official calendar retrieved. Characters:", len(content))
              return content

          def parse_dividend_rows(content):
              alerts = []
              for raw_line in content.splitlines():
                  line = raw_line.strip()
                  if not line.startswith("|"):
                      continue

                  cells = [
                      normalize(cell.replace("**", "").replace("`", ""))
                      for cell in line.strip("|").split("|")
                  ]
                  if len(cells) < 5:
                      continue

                  issuer, ex_date, payment_date, dividend_type, amount = cells[:5]

                  if issuer.lower() in ("issuer", "émetteur", "emetteur", "source", ""):
                      continue
                  if re.fullmatch(r"[-:\s]+", issuer):
                      continue
                  if not re.search(r"\d{2}/\d{2}/\d{4}", ex_date):
                      continue
                  if not re.search(r"\d{2}/\d{2}/\d{4}", payment_date):
                      continue
                  if not re.search(r"\d", amount):
                      continue

                  alerts.append({
                      "company": issuer,
                      "ex_date": ex_date,
                      "payment_date": payment_date,
                      "dividend_type": dividend_type,
                      "amount": amount
                  })

              unique = {}
              for alert in alerts:
                  key = (
                      alert["company"].upper(),
                      alert["ex_date"],
                      alert["payment_date"],
                      alert["dividend_type"].upper(),
                      alert["amount"]
                  )
                  unique[key] = alert
              return list(unique.values())

          def create_issue(alert):
              identity = "|".join([
                  alert["company"],
                  alert["ex_date"],
                  alert["payment_date"],
                  alert["dividend_type"],
                  alert["amount"]
              ])
              fingerprint = hashlib.sha256(
                  identity.upper().encode("utf-8")
              ).hexdigest()[:16]

              title = (
                  "[DIVIDEND] " + alert["company"]
                  + " - " + alert["ex_date"]
                  + " - " + fingerprint
              )

              query = urllib.parse.urlencode({
                  "q": "repo:" + REPOSITORY + " is:issue " + fingerprint
              })
              _, search_result = request(
                  "https://api.github.com/search/issues?" + query
              )
              existing = json.loads(search_result)
              if existing.get("total_count", 0) > 0:
                  print("Already notified:", title)
                  return False

              morocco_time = datetime.now(
                  ZoneInfo("Africa/Casablanca")
              ).isoformat()

              body = "\n".join([
                  "## Nouveau dividende détecté - Bourse de Casablanca",
                  "",
                  "*Société :* " + alert["company"],
                  "*Date de détachement :* " + alert["ex_date"],
                  "*Date de paiement :* " + alert["payment_date"],
                  "*Type :* " + alert["dividend_type"],
                  "*Montant brut par action :* " + alert["amount"],
                  "",
                  "*Détection (heure du Maroc) :* " + morocco_time,
                  "",
                  "*Source officielle :* " + OFFICIAL_URL,
                  "",
                  "Cette alerte provient du calendrier général des dividendes. "
                  "Elle n'est pas limitée aux titres actuellement détenus dans le PEA.",
                  "",
                  "---",
                  "Mon Portfolio - Dividend Monitor V6"
              ])

              _, result = request(
                  API + "/issues",
                  method="POST",
                  data={"title": title, "body": body}
              )
              created = json.loads(result)
              if "html_url" not in created:
                  raise RuntimeError(
                      "GitHub issue creation failed: "
                      + json.dumps(created, ensure_ascii=False)
                  )

              print("ALERT CREATED:", created["html_url"])
              return True

          def main():
              print("========================================")
              print("DIVIDEND MONITOR - ALL BVC COMPANIES V6")
              print("========================================")
              print("UTC:", datetime.now(timezone.utc).isoformat())
              print(
                  "Morocco:",
                  datetime.now(ZoneInfo("Africa/Casablanca")).isoformat()
              )
              print("SSL verification: ENABLED")

              content = get_calendar()
              alerts = parse_dividend_rows(content)

              print("Dividend rows found:", len(alerts))
              if not alerts:
                  raise RuntimeError(
                      "No dividend rows were parsed. "
                      "The official calendar format may have changed; "
                      "no success will be reported."
                  )

              created = 0
              for alert in alerts:
                  print(
                      "Checking:", alert["company"],
                      "| ex-date:", alert["ex_date"],
                      "| amount:", alert["amount"]
                  )
                  if create_issue(alert):
                      created += 1

              print("New alerts:", created)
              print("Monitor completed successfully.")

          if __name__ == "__main__":
              main()
