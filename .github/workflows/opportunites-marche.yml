name: Actualiser les opportunités du marché
on:
  schedule:
    - cron: '45 18 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/opportunites-marche.yml
      - scripts/collecter_marche.py
permissions:
  contents: write
concurrency:
  group: opportunites-marche
  cancel-in-progress: false
jobs:
  marche:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Collecter les cours et ratios
        run: python3 scripts/collecter_marche.py
      - name: Publier la sélection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunites-marche.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualiser les données des actions cotées"
          git pull --rebase
          git push
