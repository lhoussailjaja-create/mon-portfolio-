name: Actualiser les publications pour Analyse
on:
  schedule:
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/actualiser-analyse.yml
permissions:
  contents: write
concurrency:
  group: actualiser-analyse
  cancel-in-progress: false
jobs:
  publications:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Installer pdftotext
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Lire les publications officielles
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          import json
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen

          sources = {
              "AMMC": "https://www.ammc.ma/fr/communiques-presse-emetteurs",
              "Bourse de Casablanca": "https://www.casablanca-bourse.com/apropos/publications/emetteurs",
          }
          path = Path("publications-analyse.json")
          previous = json.loads(path.read_text()) if path.exists() else {}
          articles = {item["url"]: item for item in previous.get("publications", [])}
          now = datetime.now(timezone.utc).isoformat(timespec="seconds")
          availability = {}

          class Links(HTMLParser):
              def __init__(self, base, source):
                  super().__init__(convert_charrefs=True)
                  self.base = base
                  self.source = source
                  self.href = ""
                  self.parts = []
                  self.items = {}

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.href = dict(attrs).get("href") or ""
                      self.parts = []

              def handle_data(self, data):
                  if self.href:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag != "a" or not self.href:
                      return
                  url = urljoin(self.base, self.href)
                  self.href = ""
                  link = urlsplit(url)
                  title = " ".join(" ".join(self.parts).split())
                  if link.scheme != "https" or link.netloc != urlsplit(self.base).netloc:
                      return
                  relevant = (
                      link.path.startswith("/fr/actualites/communique-presse/")
                      or "/pemetteur/" in link.path
                      or "/publications/emetteurs/" in link.path
                  )
                  if relevant and len(title) >= 18:
                      self.items[url] = {"title": title, "url": url, "source": self.source}

          class AmmcRows(HTMLParser):
              def __init__(self, base):
                  super().__init__(convert_charrefs=True)
                  self.base = base
                  self.items = {}
                  self.row = None
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = attrs.get("class", "").split()
                  if tag == "li" and "actualites-row" in classes:
                      self.row = {"title": [], "date": "", "url": ""}
                  if self.row is None:
                      return
                  if tag == "div" and "views-field-title" in classes:
                      self.in_title = True
                  if tag == "time":
                      self.row["date"] = attrs.get("datetime", "")[:10]
                  if tag == "a":
                      url = urljoin(self.base, attrs.get("href") or "")
                      link = urlsplit(url)
                      if (link.scheme == "https" and link.netloc == "www.ammc.ma"
                              and link.path.startswith("/sites/default/files/")
                              and link.path.lower().endswith(".pdf")):
                          self.row["url"] = url

              def handle_data(self, data):
                  if self.in_title and self.row is not None:
                      self.row["title"].append(data)

              def handle_endtag(self, tag):
                  if tag == "div":
                      self.in_title = False
                  if tag != "li" or self.row is None:
                      return
                  url = self.row["url"]
                  title = " ".join(" ".join(self.row["title"]).split())
                  date = self.row["date"]
                  if url and title and date:
                      self.items[url] = {"url": url, "title": title, "published_on": date, "source": "AMMC"}
                  self.row = None
                  self.in_title = False

          for source, url in sources.items():
              try:
                  collected = {}
                  for page_url in ([url, url + "?page=1", url + "?page=2"] if source == "AMMC" else [url]):
                      try:
                          request = Request(page_url, headers={"User-Agent": "MonPortfolio/1.0"})
                          with urlopen(request, timeout=15) as response:
                              html = response.read().decode("utf-8", errors="replace")
                          links = AmmcRows(url) if source == "AMMC" else Links(url, source)
                          links.feed(html)
                          if not links.items:
                              raise ValueError("Aucune publication reconnue")
                          collected.update(links.items)
                      except (OSError, ValueError) as error:
                          if not collected:
                              raise
                          print(f"{page_url}: {error}")
                          break
                  for key, item in collected.items():
                      articles[key] = {"first_seen": articles.get(key, {}).get("first_seen", now), **item}
                  availability[source] = {"ok": True}
              except (OSError, ValueError) as error:
                  availability[source] = {"ok": False}
                  print(f"{source}: {error}")

          from calendar import monthrange
          from concurrent.futures import ThreadPoolExecutor
          import re
          import subprocess
          import unicodedata
          
          def normalized(value):
              return " ".join("".join(c for c in unicodedata.normalize("NFKD", value.lower())
                                      if not unicodedata.combining(c)).split())
          
          months = "janvier fevrier mars avril mai juin juillet aout septembre octobre novembre decembre".split()
          month_names = "|".join(months)
          date_pattern = r"(?:(\d{1,2})\s+)?(" + month_names + r")\s+(20\d{2})"
          numeric = r"[−-]?\d+(?:[ .]\d{3})*(?:[,.]\d+)?"
          unit_pattern = r"mmdh|mmad|mdh|m\s*mad|mds?\s*mad|milliards? de dirhams|millions? de dirhams"
          money_pattern = rf"({numeric})\s*({unit_pattern})\b"
          debt_label = r"(?:endettement net|dette nette)(?: consolide[e]?)?"
          first_date = r"\s+(?:au|a fin)\s+" + date_pattern
          comparison = r"\s*,?\s*(?:contre|versus)\s+(une tresorerie nette positive de\s+)?"
          after = re.compile(debt_label + r"\s*[^.;\d]{0,100}?" + money_pattern + first_date +
                             comparison + money_pattern + first_date)
          before = re.compile(r"(?:au|a fin)\s+" + date_pattern + r"\s*,\s*l['’]"
                              + debt_label + r"\s*[^.;\d]{0,100}?" + money_pattern +
                              comparison + money_pattern + first_date)

          def amount(raw, unit):
              number = raw.replace(" ", "").replace("−", "-")
              if "," in number:
                  number = number.replace(".", "").replace(",", ".")
              elif re.fullmatch(r"-?\d{1,3}(?:\.\d{3})+", number):
                  number = number.replace(".", "")
              return float(number) * (1000 if unit in ("mmdh", "md mad", "mds mad") or unit.startswith("milliard") else 1)

          def date_iso(day, month, year):
              month = months.index(month) + 1
              year = int(year)
              return datetime(year, month, int(day) if day else monthrange(year, month)[1]).date().isoformat()

          def extract_debt(document, url):
              matches = set()
              plain = normalized(document)
              candidates = []
              for match in after.finditer(plain):
                  current, unit, day, month, year, positive_cash, prior, old_unit, old_day, old_month, old_year = match.groups()
                  candidates.append((current, unit, day, month, year, positive_cash, prior, old_unit, old_day, old_month, old_year))
              for match in before.finditer(plain):
                  day, month, year, current, unit, positive_cash, prior, old_unit, old_day, old_month, old_year = match.groups()
                  candidates.append((current, unit, day, month, year, positive_cash, prior, old_unit, old_day, old_month, old_year))
              for current, unit, day, month, year, positive_cash, prior, old_unit, old_day, old_month, old_year in candidates:
                  dates = date_iso(day, month, year), date_iso(old_day, old_month, old_year)
                  if dates[1] < dates[0] <= now[:10]:
                      previous_amount = amount(prior, old_unit)
                      matches.add((*dates, amount(current, unit), -abs(previous_amount) if positive_cash else previous_amount))
              if len(matches) != 1:
                  return None
              date, prior_date, current, prior = matches.pop()
              return {"date": date, "prior_date": prior_date, "current_mdh": current, "prior_mdh": prior, "url": url}

          class PdfLinks(HTMLParser):
              def __init__(self, base):
                  super().__init__()
                  self.base = base
                  self.urls = set()
          
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  url = urljoin(self.base, dict(attrs).get("href") or "")
                  link = urlsplit(url)
                  if link.scheme == "https" and link.hostname == "www.ammc.ma" and link.path.lower().endswith(".pdf"):
                      self.urls.add(url)
          
          def official_bytes(url, maximum):
              request = Request(url, headers={"User-Agent": "MonPortfolio/1.0"})
              with urlopen(request, timeout=10) as response:
                  final = urlsplit(response.geturl())
                  if final.scheme != "https" or final.hostname != "www.ammc.ma":
                      raise ValueError("Redirection hors AMMC")
                  data = response.read(maximum + 1)
              if len(data) > maximum:
                  raise ValueError("Document trop volumineux")
              return data
          
          def issuer_key(name):
              return re.sub(r"[^a-z0-9]+", " ", normalized(name)).upper().strip()

          market = json.loads(Path("opportunites-marche.json").read_text())
          issuers = {issuer_key(row["name"]): issuer_key(row["name"]) for row in market["rows"]}
          issuers.update({
              "SODEP MARSA MAROC": "MARSA MAROC", "CMGP GROUP": "CMGP",
              "T2S GROUP HOLDING": "T2S GROUP", "RDS": "DAR SAADA",
              "RESIDENCES DAR SAADA": "DAR SAADA", "ARADEI CAPITAL": "ARADEI",
              "LABELVIE": "LABEL VIE", "GROUPE LABELVIE": "LABEL VIE",
              "IMMORENTE INVEST": "IMMORENTE",
          })
          debts = previous.get("net_debt", {})

          def collect_debt(task):
              issuer, article = task
              try:
                  url = article["url"]
                  if urlsplit(url).path.lower().endswith(".pdf"):
                      candidates = [url]
                  else:
                      pdfs = PdfLinks(url)
                      pdfs.feed(official_bytes(url, 2_000_000).decode("utf-8", errors="replace"))
                      candidates = sorted(pdfs.urls)[:3]
                  for pdf in candidates:
                      data = official_bytes(pdf, 10_000_000)
                      document = subprocess.check_output(
                          ["pdftotext", "-layout", "-", "-"], input=data, timeout=10,
                      ).decode("utf-8")
                      debt = extract_debt(document, pdf)
                      if debt:
                          return issuer, debt
              except (OSError, ValueError, subprocess.SubprocessError) as error:
                  print(f"Dette nette {issuer}: {error}")
              return issuer, None

          tasks = []
          for article in sorted(articles.values(), key=lambda item: item.get("published_on") or "", reverse=True):
              title = article["title"]
              issuer = issuers.get(issuer_key(re.split(r" +[-–—] +", title, maxsplit=1)[0]))
              publication = article.get("published_on", "")
              if (issuer and article["source"] == "AMMC" and publication > debts.get(issuer, {}).get("date", "")
                      and re.search(r"indicateurs|resultats financiers|rapport financier", normalized(title))):
                  tasks.append((issuer, article))

          with ThreadPoolExecutor(max_workers=8) as executor:
              for issuer, debt in executor.map(collect_debt, tasks[:36]):
                  if debt and debt["date"] > debts.get(issuer, {}).get("date", ""):
                      debts[issuer] = debt

          path.write_text(json.dumps(
              {"checked_at": now, "last_success_at": now if any(item["ok"] for item in availability.values()) else previous.get("last_success_at"), "sources": availability, "publications": list(articles.values()), "net_debt": debts},
              ensure_ascii=False, indent=2
          ) + "\n")
          PY
      - name: Publier le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications-analyse.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualiser les publications de l’analyse"
          git pull --rebase
          git push
