name: Actualiser les publications pour Analyse
on:
  schedule:
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/actualiser-analyse.yml
permissions:
  contents: write
concurrency:
  group: actualiser-analyse
  cancel-in-progress: false
jobs:
  publications:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Installer pdftotext
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Lire les publications officielles
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          import json
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen

          sources = {
              "AMMC": "https://www.ammc.ma/fr/communiques-presse-emetteurs",
              "Bourse de Casablanca": "https://www.casablanca-bourse.com/apropos/publications/emetteurs",
          }
          path = Path("publications-analyse.json")
          previous = json.loads(path.read_text()) if path.exists() else {}
          articles = {item["url"]: item for item in previous.get("publications", [])}
          now = datetime.now(timezone.utc).isoformat(timespec="seconds")
          availability = {}

          class Links(HTMLParser):
              def __init__(self, base, source):
                  super().__init__(convert_charrefs=True)
                  self.base = base
                  self.source = source
                  self.href = ""
                  self.parts = []
                  self.items = {}

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.href = dict(attrs).get("href") or ""
                      self.parts = []

              def handle_data(self, data):
                  if self.href:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag != "a" or not self.href:
                      return
                  url = urljoin(self.base, self.href)
                  self.href = ""
                  link = urlsplit(url)
                  title = " ".join(" ".join(self.parts).split())
                  if link.scheme != "https" or link.netloc != urlsplit(self.base).netloc:
                      return
                  relevant = (
                      link.path.startswith("/fr/actualites/communique-presse/")
                      or "/pemetteur/" in link.path
                      or "/publications/emetteurs/" in link.path
                  )
                  if relevant and len(title) >= 18:
                      self.items[url] = {"title": title, "url": url, "source": self.source}

          for source, url in sources.items():
              try:
                  request = Request(url, headers={"User-Agent": "MonPortfolio/1.0"})
                  with urlopen(request, timeout=25) as response:
                      html = response.read().decode("utf-8", errors="replace")
                  links = Links(url, source)
                  links.feed(html)
                  if not links.items:
                      raise ValueError("Aucune publication reconnue")
                  for key, item in links.items.items():
                      articles[key] = {"first_seen": articles.get(key, {}).get("first_seen", now), **item}
                  availability[source] = {"ok": True}
              except (OSError, ValueError) as error:
                  availability[source] = {"ok": False}
                  print(f"{source}: {error}")

          if not any(item["ok"] for item in availability.values()):
              raise SystemExit("Aucune source disponible. Le dernier résultat est conservé.")
          import re
          import subprocess
          import tempfile
          import unicodedata
          
          def normalized(value):
              return " ".join("".join(c for c in unicodedata.normalize("NFKD", value.lower())
                                      if not unicodedata.combining(c)).split())
          
          months = "janvier fevrier mars avril mai juin juillet aout septembre octobre novembre decembre".split()
          date_pattern = r"(\d{1,2})\s+(" + "|".join(months) + r")\s+(20\d{2})"
          money_pattern = r"([−-]?\d+(?:[ .]\d{3})*(?:[,.]\d+)?)\s*(mmdh|mdh|m\s*mad|md\s*mad|milliards? de dirhams|millions? de dirhams)\b"
          debt_pattern = re.compile(
              r"(?:endettement net|dette nette)(?: consolide[e]?)?\s*[^.;]{0,65}?"
              + money_pattern + r"\s+(?:au|a fin)\s+" + date_pattern
              + r"\s*,?\s*(?:contre|versus)\s+" + money_pattern
              + r"\s+(?:au|a fin)\s+" + date_pattern
          )
          
          def amount(raw, unit):
              number = raw.replace(" ", "").replace("−", "-")
              if "," in number:
                  number = number.replace(".", "").replace(",", ".")
              return float(number) * (1000 if unit in ("mmdh", "md mad") or unit.startswith("milliard") else 1)
          
          def date_iso(day, month, year):
              return datetime(int(year), months.index(month) + 1, int(day)).date().isoformat()
          
          def extract_debt(document, url):
              matches = set()
              for match in debt_pattern.finditer(normalized(document)):
                  current, unit, day, month, year, prior, old_unit, old_day, old_month, old_year = match.groups()
                  dates = date_iso(day, month, year), date_iso(old_day, old_month, old_year)
                  if dates[1] < dates[0] <= now[:10]:
                      matches.add((*dates, amount(current, unit), amount(prior, old_unit)))
              if len(matches) != 1:
                  return None
              date, prior_date, current, prior = matches.pop()
              return {"date": date, "prior_date": prior_date, "current_mdh": current, "prior_mdh": prior, "url": url}
          
          class PdfLinks(HTMLParser):
              def __init__(self, base):
                  super().__init__()
                  self.base = base
                  self.urls = set()
          
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  url = urljoin(self.base, dict(attrs).get("href") or "")
                  link = urlsplit(url)
                  if link.scheme == "https" and link.hostname == "www.ammc.ma" and link.path.lower().endswith(".pdf"):
                      self.urls.add(url)
          
          def official_bytes(url, maximum):
              request = Request(url, headers={"User-Agent": "MonPortfolio/1.0"})
              with urlopen(request, timeout=10) as response:
                  final = urlsplit(response.geturl())
                  if final.scheme != "https" or final.hostname != "www.ammc.ma":
                      raise ValueError("Redirection hors AMMC")
                  data = response.read(maximum + 1)
              if len(data) > maximum:
                  raise ValueError("Document trop volumineux")
              return data
          
          debts = previous.get("net_debt", {})
          issuers = {"marsa maroc": "MARSA MAROC", "akdital": "AKDITAL", "sgtm": "SGTM"}
          seen = set()
          for article in reversed(list(articles.values())):
              title = normalized(article["title"])
              issuer = next((key for name, key in issuers.items() if re.search(r"\b" + name + r"\b", title)), None)
              if not issuer or article["source"] != "AMMC" or issuer in seen:
                  continue
              seen.add(issuer)
              try:
                  url = article["url"]
                  html = official_bytes(url, 2_000_000).decode("utf-8", errors="replace")
                  pdfs = PdfLinks(url)
                  pdfs.feed(html)
                  for pdf in sorted(pdfs.urls)[:3]:
                      with tempfile.TemporaryDirectory() as directory:
                          file = Path(directory) / "publication.pdf"
                          file.write_bytes(official_bytes(pdf, 10_000_000))
                          document = subprocess.check_output(["pdftotext", "-layout", str(file), "-"], timeout=10).decode("utf-8")
                      debt = extract_debt(document, pdf)
                      if debt and debt["date"] >= debts.get(issuer, {}).get("date", ""):
                          debts[issuer] = debt
              except (OSError, ValueError, subprocess.SubprocessError) as error:
                  print(f"Dette nette {issuer}: {error}")

          path.write_text(json.dumps(
              {"checked_at": now, "sources": availability, "publications": list(articles.values()), "net_debt": debts},
              ensure_ascii=False, indent=2
          ) + "\n")
          PY
      - name: Publier le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications-analyse.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualiser les publications de l’analyse"
          git pull --rebase
          git push
