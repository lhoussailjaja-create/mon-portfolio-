name: Test 02 - Connexion cours AKDITAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connexion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tester les sources depuis GitHub Actions
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, datetime
          urls = {
              'Bourse de Casablanca': 'https://www.casablanca-bourse.com/live-market/overview',
              'Attijarinet cours titres': 'https://attijarinet.attijariwafa.com/particulier/public/courstitre',
          }
          print('TEST 02 - CONNECTIVITE SERVEUR (pas encore extraction du cours AKDITAL)')
          print('UTC:', datetime.datetime.now(datetime.timezone.utc).isoformat())
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; PortfolioDiagnostic/1.0)', 'Accept': 'text/html'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      sample = resp.read(5000)
                      print(f'{name}: HTTP {resp.status}, type={resp.headers.get("Content-Type", "inconnu")}, octets lus={len(sample)}')
              except Exception as exc:
                  print(f'{name}: ECHEC {type(exc).__name__}: {exc}')
          print('FIN TEST 02 - aucune cotation validée, aucun fichier portefeuille modifié')
          PY
